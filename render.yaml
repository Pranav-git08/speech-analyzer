services:
  - type: web
    name: voxis-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx tsc
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SERVICE
        value: gmail
